<!doctype html>
<!--
  Source of public/apple-touch-icon.png, the 180x180 icon iOS uses for "Add to Home Screen".
  The monogram from the header, full-bleed: iOS rounds the corners itself.
  Rendered by scripts/render-images.mjs: npm run images
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>apple-touch-icon.png</title>
    <style>
      html,
      body {
        margin: 0;
      }

      .icon {
        width: 180px;
        height: 180px;
        display: grid;
        place-items: center;
        background: linear-gradient(110deg, oklch(0.8 0.11 190), oklch(0.86 0.15 155), oklch(0.91 0.18 128));
        color: #052022;
        font: 700 64px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="icon">SV</div>
  </body>
</html>
