<!doctype html>
<!--
  Source of public/og.png, the 1200x630 link-preview image (Open Graph).
  Frame "4f · OG image · Aurora" in the design's Overview.dc.html.
  Rendered by scripts/render-images.mjs: npm run images
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og.png</title>
    <style>
      html,
      body {
        margin: 0;
      }

      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
          radial-gradient(90% 90% at 100% 0%, oklch(0.62 0.14 150 / 0.75) 0%, transparent 55%),
          radial-gradient(80% 80% at 0% 100%, oklch(0.5 0.1 210 / 0.7) 0%, transparent 60%),
          radial-gradient(50% 50% at 88% 88%, oklch(0.85 0.18 130 / 0.45) 0%, transparent 70%),
          #05282b;
        color: #eef7f3;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .monogram {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(110deg, oklch(0.8 0.11 190), oklch(0.86 0.15 155), oklch(0.91 0.18 128));
        color: #052022;
        font: 700 26px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }

      .domain {
        font: 500 26px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #cfe2dc;
      }

      .role {
        margin: 0 0 20px;
        font: 500 28px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: oklch(0.92 0.15 135);
      }

      h1 {
        margin: 0;
        font-size: 112px;
        line-height: 1;
        letter-spacing: -0.04em;
        font-weight: 700;
      }

      .project {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 36px;
        font-size: 30px;
        color: #cfe2dc;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: oklch(0.9 0.19 135);
      }

      .project strong {
        color: #eef7f3;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="top">
        <div class="monogram">SV</div>
        <span class="domain">vorobev.dev</span>
      </div>
      <div>
        <p class="role">Python backend developer</p>
        <h1>Sergey Vorobev</h1>
        <div class="project">
          <span class="dot"></span>
          <span><strong>Crypto Alerts</strong> — live demo, dashboard &amp; source</span>
        </div>
      </div>
    </div>
  </body>
</html>
