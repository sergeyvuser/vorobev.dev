      <stop offset="0" stop-color="#6fd0c6"/>
      <stop offset="0.5" stop-color="#8ee0a2"/>
      <stop offset="1" stop-color="#c4ef7c"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="9" fill="url(#g)"/>
  <text x="18" y="18" dominant-baseline="central" text-anchor="middle" fill="#052022"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700">SV</text>
</svg>
